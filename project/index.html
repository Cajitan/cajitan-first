<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monsoon Melody: A Village Rain Journey</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Overlay -->
        <div id="ui-overlay">
            <div id="memory-counter">
                <span class="memory-icon">🌸</span>
                <span id="memory-count">0</span> memories
            </div>
            
            <div id="progress-indicator">
                <div>Exploration: <span id="exploration-percent">0</span>%</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                </div>
            </div>
            
            <div id="interaction-prompt" class="hidden">
                <p id="prompt-text"></p>
                <div class="prompt-actions">
                    <button id="interact-btn">Interact</button>
                    <button id="skip-btn">Continue</button>
                </div>
            </div>
            
            <div id="story-panel" class="hidden">
                <div class="story-content">
                    <h3 id="story-title"></h3>
                    <p id="story-text"></p>
                    <button id="story-close">Continue Journey</button>
                </div>
            </div>
        </div>
        
        <!-- Start Screen -->
        <div id="start-screen">
            <div class="start-content">
                <h1>Monsoon Melody</h1>
                <h2>A Village Rain Journey</h2>
                <p class="subtitle">Experience the gentle poetry of rural Bangladesh during monsoon season</p>
                <button id="start-game">Begin Journey</button>
                <div class="credits">
                    <p>Use arrow keys or WASD to move • Click to interact</p>
                </div>
            </div>
            <div class="rain-overlay"></div>
        </div>
    </div>
    
    <script src="js/game.js"></script>
    <script src="js/player.js"></script>
    <script src="js/environment.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
